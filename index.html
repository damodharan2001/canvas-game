<html>
  <head>
    <title>Dnake Game</title>
    <meta charset="UTF-8" />
    <meta name="description" content="Dnake is a snake game" />
    <meta name="keywords" content="Game" />
    <meta name="author" content="Damodharan" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  </head>

  <body>
    <div class="root">
      <div id="game-container" class="canvas-container flex flex-col">
        <div class="canvas-topbar spaceBetweenDiv">
          <div>
            <span class="title">Dnake Game</span>
          </div>

          <div class="endDiv" style="width: 50%">
            <div style="margin-right: 10%" cla>
              <span class="title"
                >Points :
                <span id="points" class="title score">0</span>
              </span>
            </div>

            <button onclick="pause_game()" id="menu-btn" class="menu-btn btn">
              Setting
            </button>
          </div>
        </div>
        <div class="centerDiv w-100 h-100">
          <canvas id="canvas" width="200" height="200"></canvas>
        </div>
      </div>
    </div>

    <!-- Start Menu -->
    <div id="menu-screen" class="game-start-page centerDiv">
      <div class="menu-container centerDiv">
        <button onclick="start_game()" id="start-btn" class="start-btn btn">
          Start
        </button>
      </div>
    </div>

    <!-- Setting Menu -->
    <div id="menu-screen-setting" class="game-end-page centerDiv hidden">
      <div class="menu-container centerDiv flex-col">
        <button onclick="resume_game()" id="start-btn" class="start-btn btn">
          Resume
        </button>
        <button
          style="margin-top: 15px"
          onclick="start_game()"
          id="start-btn"
          class="start-btn btn"
        >
          Restart
        </button>
      </div>
    </div>

    <!-- End Menu -->
    <div id="menu-screen-end" class="game-end-page centerDiv hidden">
      <div class="menu-container centerDiv flex-col">
        <span class="endtitle"
          >Points :
          <span id="end-points" class="endtitle">0</span>
        </span>
        <button onclick="start_game()" id="start-btn" class="start-btn btn">
          Restart
        </button>
      </div>
    </div>

    <!-- Setting Menu -->

    <div id="menu-screen-setting" class="game-end-page centerDiv hidden">
      <div class="menu-container centerDiv flex-col">
        <span class="endtitle"
          >Points :
          <span id="end-points" class="endtitle">0</span>
        </span>
        <button onclick="start_game()" id="start-btn" class="start-btn btn">
          Restart
        </button>
      </div>
    </div>

    <!-- Audio Effect -->
    <audio src="./bg.mp3" id="bg-music"></audio>
    <audio src="./end.mp3" id="end-music"></audio>
    <audio src="./points.mp3" id="points-music"></audio>
    <audio src="./change.mp3" id="change-music"></audio>
  </body>
  <script>
    let highScore;
    let startGame = false;
    let endGame = false;
    let pauseGame = false;
    let context;
    let initialSpeed = 200;
    let speed = initialSpeed;
    let elaspeTime = 0;
    const minSpeed = 50;
    const topBarHeight = 70;
    const spaceWidth = 50;
    const snakeSize = 40;
    let pauseDirectionAudio = false;
    let foodSet = false;
    let foodSize = Math.round(snakeSize / 4);
    let prevTouchX;
    let prevTouchY;
    let moveInterval;
    let animInterval;
    let screenWidth =
      window.innerWidth -
      spaceWidth -
      ((window.innerWidth - spaceWidth) % snakeSize);
    let screenHeight =
      window.innerHeight -
      topBarHeight -
      ((window.innerHeight - topBarHeight) % snakeSize);
    const startX = Math.round(screenWidth / (snakeSize * 4)) * snakeSize;
    const startY = Math.round(screenHeight / (snakeSize * 4)) * snakeSize;

    const bgAudio = document.getElementById("bg-music");
    const endAudio = document.getElementById("end-music");
    const pointsAudio = document.getElementById("points-music");
    const changeAudio = document.getElementById("change-music");

    const canvas = document.getElementById("canvas");
    if (canvas) {
      canvas.width = screenWidth;
      canvas.height = screenHeight;
      const ctx = canvas.getContext("2d");
      context = ctx;
    }

    let foodPosX;
    let foodPosY;
    let addNew = false;
    let moveDirection = "+x";
    let snake = [
      {
        x: startX,
        y: startY,
      },
    ];

    let localScore = localStorage.getItem("high_score");

    if (localScore) {
    }

    function updatePoints() {
      navigator.vibrate(1000);
      points_audio();
      let pointsDiv = document.getElementById("points");
      if (pointsDiv) {
        if (Number(pointsDiv.innerText) + (1 % 20)) {
          initialSpeed -= 5;
        }
        pointsDiv.innerText = Number(pointsDiv.innerText) + 1;
      }
    }

    function drawSnake(context, snake) {
      for (let i = 0; i < snake.length; i++) {
        let b = snake[i];

        if (i == 0) {
          context.shadowColor = "black";
          context.shadowBlur = 1;
          context.fillStyle = "blueviolet";
          context.fillRect(b.x + 1, b.y + 1, snakeSize - 2, snakeSize - 2);
        } else {
          context.shadowColor = "blueviolet";
          context.shadowBlur = 1;
          context.fillStyle = "greenyellow";
          context.fillRect(b.x + 1, b.y + 1, snakeSize - 2, snakeSize - 2);
        }
      }
    }

    function food(x, y) {
      context.beginPath();
      context.arc(x, y, foodSize, 0, 2 * Math.PI);
      context.fillStyle = "brown";
      context.fill();

      if (startGame) {
        animInterval = setInterval(() => {
          context.clearRect(
            x - foodSize - 1,
            y - foodSize - 1,
            foodSize * 2 + 2,
            foodSize * 2 + 2
          );
          foodSize = foodSize == 0 ? foodSize + Math.round(snakeSize / 4) : 0;
          context.beginPath();
          context.arc(x, y, foodSize, 0, 2 * Math.PI);
          context.fillStyle = "brown";
          context.fill();
        }, 300);
      } else {
        if (animInterval) {
          clearInterval(animInterval);
        }
      }

      if (endGame) {
        if (animInterval) {
          clearInterval(animInterval);
        }
      }
    }

    function setFood() {
      let val = snakeSize / 2;
      if (foodPosX && foodPosY) {
        clearInterval(animInterval);
        context.clearRect(
          foodPosX - foodSize - 1,
          foodPosY - foodSize - 1,
          foodSize * 2 + 2,
          foodSize * 2 + 2
        );
      }
      let randomXDigit = Math.max(
        1,
        Math.min(3, Math.round(Math.random() * 10))
      );
      let randomYDigit = Math.max(
        1,
        Math.min(3, Math.round(Math.random() * 10))
      );
      let randomXNum = Math.round(Math.random() * 10 ** randomXDigit);
      let randomYNum = Math.round(Math.random() * 10 ** randomYDigit);
      randomXNum =
        randomXNum +
        (randomXNum % snakeSize < val
          ? val - ((randomXNum % snakeSize) % val)
          : -((randomXNum % snakeSize) % val));
      randomYNum =
        randomYNum +
        (randomYNum % snakeSize < val
          ? val - ((randomYNum % snakeSize) % val)
          : -((randomYNum % snakeSize) % val));

      // ---------------- Fitting random number to the screen width -----------------
      while (randomXNum >= screenWidth || randomXNum <= 0) {
        randomXNum = Math.round(Math.random() * 10 ** randomXDigit);
        randomXNum =
          randomXNum +
          (randomXNum % snakeSize < val
            ? val - ((randomXNum % snakeSize) % val)
            : -((randomXNum % snakeSize) % val));
      }

      // ---------------- Fitting random number to the screen height -----------------
      while (randomYNum >= screenHeight || randomYNum <= 0) {
        randomYNum = Math.round(Math.random() * 10 ** randomYDigit);
        randomYNum =
          randomYNum +
          (randomYNum % snakeSize < val
            ? val - ((randomYNum % snakeSize) % val)
            : -((randomYNum % snakeSize) % val));
      }

      if (startGame) {
        foodPosX = randomXNum;
        foodPosY = randomYNum;
        food(randomXNum, randomYNum);
      }
    }

    function gameFunc() {
      if (context) {
        if (!pauseGame && startGame && foodSet) {
          setFood();
          drawSnake(context, snake);
          foodSet = false;
        }

        function handleSnakeMoveMent(t) {
          if (!endGame && !pauseGame) {
            if (t - elaspeTime >= speed) {
              elaspeTime = t;
              let newSnake = [];
              let prevX;
              let prevY;
              switch (moveDirection) {
                case "+x":
                  for (let i = 0; i < snake.length; i++) {
                    let b = snake[i];

                    if (i == 0) {
                      prevX = b.x;
                      prevY = b.y;
                      b.x += snakeSize;

                      if (
                        b.x + Math.round(snakeSize / 2) == foodPosX &&
                        b.y + Math.round(snakeSize / 2) == foodPosY
                      ) {
                        updatePoints();
                        addNew = true;
                        setFood();
                      }

                      if (snake.length > 1 && b.x == snake[i + 1]?.x) {
                        b.x -= snakeSize;
                        break;
                      }
                      if (b.x > screenWidth - snakeSize) {
                        b.x -= snakeSize;
                        end_audio();
                        end_game();
                        endGame = true;
                        startGame = false;
                        break;
                      } else if (b.x < 0) {
                        b.x -= snakeSize;
                        end_audio();
                        end_game();
                        endGame = true;
                        startGame = false;
                        break;
                      }
                    } else {
                      let tempX = b.x;
                      let tempY = b.y;
                      b.x = prevX;
                      b.y = prevY;

                      prevX = tempX;
                      prevY = tempY;
                    }
                    context.clearRect(prevX, prevY, snakeSize, snakeSize);
                    newSnake.push(b);
                  }

                  if (newSnake.length > 0) {
                    if (addNew) {
                      snake.push({
                        x: prevX,
                        y: prevY,
                      });
                      newSnake.push({
                        x: prevX,
                        y: prevY,
                      });
                      addNew = false;
                    }
                    drawSnake(context, newSnake);
                  }

                  break;
                case "-x":
                  for (let i = 0; i < snake.length; i++) {
                    let b = snake[i];

                    if (i == 0) {
                      prevX = b.x;
                      prevY = b.y;
                      b.x -= snakeSize;
                      if (
                        b.x + Math.round(snakeSize / 2) == foodPosX &&
                        b.y + Math.round(snakeSize / 2) == foodPosY
                      ) {
                        updatePoints();
                        addNew = true;
                        setFood();
                      }

                      if (snake.length > 1 && b.x == snake[i + 1]?.x) {
                        b.x += snakeSize;
                        break;
                      }
                      if (b.x > screenWidth - snakeSize) {
                        b.x += snakeSize;
                        end_audio();
                        end_game();
                        endGame = true;
                        startGame = false;
                        break;
                      } else if (b.x < 0) {
                        b.x += snakeSize;
                        end_audio();
                        end_game();
                        endGame = true;
                        startGame = false;
                        break;
                      }
                    } else {
                      let tempX = b.x;
                      let tempY = b.y;
                      b.x = prevX;
                      b.y = prevY;

                      prevX = tempX;
                      prevY = tempY;
                    }
                    context.clearRect(prevX, prevY, snakeSize, snakeSize);
                    newSnake.push(b);
                  }
                  if (newSnake.length > 0) {
                    if (addNew) {
                      snake.push({
                        x: prevX,
                        y: prevY,
                      });
                      newSnake.push({
                        x: prevX,
                        y: prevY,
                      });
                      addNew = false;
                    }

                    drawSnake(context, newSnake);
                  }
                  break;
                case "+y":
                  for (let i = 0; i < snake.length; i++) {
                    let b = snake[i];
                    if (i == 0) {
                      prevX = b.x;
                      prevY = b.y;
                      b.y += snakeSize;
                      if (
                        b.x + Math.round(snakeSize / 2) == foodPosX &&
                        b.y + Math.round(snakeSize / 2) == foodPosY
                      ) {
                        updatePoints();
                        addNew = true;
                        setFood();
                      }

                      if (snake.length > 1 && b.y == snake[i + 1]?.y) {
                        b.y -= snakeSize;
                        break;
                      }
                      if (b.y > screenHeight - snakeSize) {
                        b.y -= snakeSize;
                        end_audio();
                        end_game();
                        endGame = true;
                        startGame = false;
                        break;
                      } else if (b.y < 0) {
                        b.y -= snakeSize;
                        end_audio();
                        end_game();
                        endGame = true;
                        startGame = false;
                        break;
                      }
                    } else {
                      let tempX = b.x;
                      let tempY = b.y;
                      b.x = prevX;
                      b.y = prevY;

                      prevX = tempX;
                      prevY = tempY;
                    }
                    context.clearRect(prevX, prevY, snakeSize, snakeSize);
                    newSnake.push(b);
                  }

                  if (newSnake.length > 0) {
                    if (addNew) {
                      snake.push({
                        x: prevX,
                        y: prevY,
                      });
                      newSnake.push({
                        x: prevX,
                        y: prevY,
                      });
                      addNew = false;
                    }
                    drawSnake(context, newSnake);
                  }

                  break;
                case "-y":
                  for (let i = 0; i < snake.length; i++) {
                    let b = snake[i];
                    if (i == 0) {
                      prevX = b.x;
                      prevY = b.y;
                      b.y -= snakeSize;
                      if (
                        b.x + Math.round(snakeSize / 2) == foodPosX &&
                        b.y + Math.round(snakeSize / 2) == foodPosY
                      ) {
                        updatePoints();
                        addNew = true;
                        setFood();
                      }
                      if (snake.length > 1 && b.y == snake[i + 1]?.y) {
                        b.y += snakeSize;
                        break;
                      }
                      if (b.y > screenHeight - snakeSize) {
                        b.y += snakeSize;
                        end_audio();
                        end_game();
                        endGame = true;
                        startGame = false;
                        break;
                      } else if (b.y < 0) {
                        b.y += snakeSize;
                        end_audio();
                        end_game();
                        endGame = true;
                        startGame = false;
                        break;
                      }
                    } else {
                      let tempX = b.x;
                      let tempY = b.y;
                      b.x = prevX;
                      b.y = prevY;

                      prevX = tempX;
                      prevY = tempY;
                    }
                    context.clearRect(prevX, prevY, snakeSize, snakeSize);
                    newSnake.push(b);
                  }
                  if (newSnake.length > 0) {
                    if (addNew) {
                      snake.push({
                        x: prevX,
                        y: prevY,
                      });
                      newSnake.push({
                        x: prevX,
                        y: prevY,
                      });
                      addNew = false;
                    }
                    drawSnake(context, newSnake);
                  }
                  break;
                default:
                  break;
              }
            } else if (elaspeTime == 0 && t) {
              elaspeTime = t + speed;
            }
            requestAnimationFrame((t) => handleSnakeMoveMent(t));
          }
        }

        function handleControl(e) {
          let key = e.key;
          switch (key) {
            case "ArrowLeft":
            case "a":
            case "A":
              if (snake.length < 1 || snake[0].x - snakeSize != snake[1]?.x) {
                moveDirection = "-x";
                if (!pauseDirectionAudio) {
                  pauseDirectionAudio = true;
                  change_audio();
                }
                if (speed > minSpeed) {
                  speed -= 5;
                }
              }
              break;
            case "ArrowRight":
            case "d":
            case "D":
              if (snake.length < 1 || snake[0].x + snakeSize != snake[1]?.x) {
                moveDirection = "+x";
                if (!pauseDirectionAudio) {
                  pauseDirectionAudio = true;
                  change_audio();
                }
                if (speed > minSpeed) {
                  speed -= 5;
                }
              }
              break;
            case "ArrowUp":
            case "w":
            case "W":
              if (snake.length < 1 || snake[0].y - snakeSize != snake[1]?.y) {
                moveDirection = "-y";
                if (!pauseDirectionAudio) {
                  pauseDirectionAudio = true;
                  change_audio();
                }

                if (speed > minSpeed) {
                  speed -= 5;
                }
              }
              break;
            case "ArrowDown":
            case "s":
            case "S":
              if (snake.length < 1 || snake[0].y + snakeSize != snake[1]?.y) {
                moveDirection = "+y";
                if (!pauseDirectionAudio) {
                  pauseDirectionAudio = true;
                  change_audio();
                }
                if (speed > minSpeed) {
                  speed -= 5;
                }
              }
              break;
            case " ":
              pause_game();
              break;
            default:
              break;
          }
        }

        function handleSpeed(e) {
          pauseDirectionAudio = false;
          speed = initialSpeed;
        }

        window.addEventListener("keydown", handleControl);
        window.addEventListener("keyup", handleSpeed);

        const handleTouchStart = (e) => {
          prevTouchX = e.changedTouches[0].clientX;
          prevTouchY = e.changedTouches[0].clientY;
        };

        const handleTouchEnd = (e) => {
          let directionX = prevTouchX - e.changedTouches[0].clientX;
          let directionY = prevTouchY - e.changedTouches[0].clientY;

          if (Math.abs(directionX) > Math.abs(directionY)) {
            if (directionX > 0) {
              if (snake.length < 1 || snake[0].x - snakeSize != snake[1]?.x) {
                moveDirection = "-x";
                if (!pauseDirectionAudio) {
                  pauseDirectionAudio = true;
                  change_audio();
                }
                if (speed > minSpeed) {
                  speed -= 5;
                }
              } else {
                if (snake.length < 1 || snake[0].x + snakeSize != snake[1]?.x) {
                  moveDirection = "+x";
                  if (!pauseDirectionAudio) {
                    pauseDirectionAudio = true;
                    change_audio();
                  }
                  if (speed > minSpeed) {
                    speed -= 5;
                  }
                }
              }
            }
          } else {
            if (directionY > 0) {
              if (snake.length < 1 || snake[0].y - snakeSize != snake[1]?.y) {
                moveDirection = "-y";
                if (!pauseDirectionAudio) {
                  pauseDirectionAudio = true;
                  change_audio();
                }

                if (speed > minSpeed) {
                  speed -= 5;
                }
              }
            } else {
              if (snake.length < 1 || snake[0].y + snakeSize != snake[1]?.y) {
                moveDirection = "+y";
                if (!pauseDirectionAudio) {
                  pauseDirectionAudio = true;
                  change_audio();
                }
                if (speed > minSpeed) {
                  speed -= 5;
                }
              }
            }
          }
        };
        window.addEventListener("touchstart", handleTouchStart);
        window.addEventListener("touchend", handleTouchEnd);
        if (startGame) {
          handleSnakeMoveMent();
        } else {
          if (moveInterval) {
            clearInterval(moveInterval);
          }
        }

        if (endGame) {
          if (moveInterval) {
            clearInterval(moveInterval);
          }
        }
      }
    }

    function pause_game() {
      let settingScreen = document.getElementById("menu-screen-setting");
      if (settingScreen) {
        settingScreen.classList.remove("hidden");
        pauseGame = true;
        gameFunc();
      }
    }

    function resume_game() {
      let settingScreen = document.getElementById("menu-screen-setting");
      if (settingScreen) {
        settingScreen.classList.add("hidden");
        pauseGame = false;
        if (moveInterval) {
          clearInterval(moveInterval);
        }
        gameFunc();
      }
    }

    function start_game() {
      foodPosX = null;
      foodPosY = null;
      addNew = false;
      moveDirection = "+x";
      foodSet = true;
      snake = [
        {
          x: startX,
          y: startY,
        },
      ];
      pauseGame = false;
      let menuScreen = document.getElementById("menu-screen");
      if (menuScreen) {
        menuScreen.classList.add("hidden");
      }

      let endScreen = document.getElementById("menu-screen-end");
      if (endScreen) {
        endScreen.classList.add("hidden");
      }

      let settingScreen = document.getElementById("menu-screen-setting");
      if (settingScreen) {
        settingScreen.classList.add("hidden");
      }

      if (bgAudio) {
        bgAudio.volume = 0.2;
        bgAudio.loop = true;
        bgAudio.play();
      }

      startGame = true;
      endGame = false;
      context.clearRect(0, 0, screenWidth, screenHeight);
      let pointsDiv = document.getElementById("points");
      if (pointsDiv) {
        pointsDiv.innerText = 0;
      }
      if (moveInterval) {
        clearInterval(moveInterval);
      }

      if (animInterval) {
        clearInterval(animInterval);
      }

      gameFunc();
    }

    function end_audio() {
      if (endAudio) {
        endAudio.play();
      }

      if (bgAudio) {
        bgAudio.pause();
      }
    }

    function change_audio() {
      if (changeAudio) {
        changeAudio.currentTime = 0;
        changeAudio.volume = 0.5;
        changeAudio.play();
      }
    }

    function points_audio() {
      if (pointsAudio) {
        pointsAudio.currentTime = 0;
        pointsAudio.play();
      }
    }

    function end_game() {
      let endPoints = document.getElementById("end-points");
      let pointsDiv = document.getElementById("points");
      if (pointsDiv) {
        if (endPoints) {
          endPoints.innerText = Number(pointsDiv.innerText);
        }
      }

      let menuScreen = document.getElementById("menu-screen-end");
      if (menuScreen) {
        menuScreen.classList.remove("hidden");
      }
      startGame = false;
    }

    // ----------------------------- Resizing Function -------------------------
    function handleResize() {
      screenWidth =
        window.innerWidth -
        spaceWidth -
        ((window.innerWidth - spaceWidth) % snakeSize);
      screenHeight =
        window.innerHeight -
        topBarHeight -
        ((window.innerHeight - topBarHeight) % snakeSize);

      const canvas = document.getElementById("canvas");
      if (canvas) {
        canvas.width = screenWidth;
        canvas.height = screenHeight;
      }
    }
    window.addEventListener("resize", handleResize);
  </script>
</html>
